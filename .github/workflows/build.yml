name: Build Auren Minecraft
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package mod (fetches verified CE assets)
        run: gradle build --no-daemon --stacktrace
      - name: Verify Auren JAR embeds an intact Uranus mod
        run: python3 scripts/verify_bundle.py
      - name: Verify Tabula bones for custom neck pose
        run: python3 scripts/verify_neck_pose.py
      - name: Verify bundled IceAndFire CE walk and flight poses
        run: python3 scripts/verify_original_animations.py
      - name: Verify distinct adult and baby follow behavior
        run: python3 scripts/verify_follow_behavior.py
      - name: Audit original Tabula hierarchy and preview composed neck pose (read-only)
        run: python3 scripts/audit_tabula_geometry.py --jar build/libs/aurenminecraft-*.jar --out build/reports/pose_audit --shoulder-config docs/AUREN_SHOULDER_POSE_V057.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auren-minecraft-neoforge-1.21.1-with-uranus
          path: build/libs/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auren-tabula-pose-audit
          path: build/reports/pose_audit/
          if-no-files-found: error
