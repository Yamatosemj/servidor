name: Build Auren Minecraft
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package mod (fetches verified CE assets)
        run: gradle build --no-daemon --stacktrace
      - name: Verify Auren JAR embeds an intact Uranus mod
        run: python3 scripts/verify_bundle.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auren-minecraft-neoforge-1.21.1-with-uranus
          path: build/libs/*.jar
          if-no-files-found: error
