name: Build ONE Auren Dragon (without full IceAndFire)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  single-auren:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build standalone Auren without CE dependency
        run: gradle build --no-daemon --stacktrace
      - name: Unit-test pure Java local intention policy without Minecraft or network
        run: |
          mkdir -p build/local-mind-test
          javac -d build/local-mind-test src/main/java/br/com/auren/minecraft/entity/AurenLocalDecisionPolicy.java scripts/LocalDecisionPolicyTest.java
          java -cp build/local-mind-test LocalDecisionPolicyTest
      - name: Verify visible idle actions, bounded paths and truthful diagnostics
        run: python3 scripts/verify_visible_routine.py
      - name: Verify offline local mind save/load, owner-only diagnostics and safe intent API
        run: python3 scripts/verify_local_mind.py
      - name: Verify Uranus library embedded (no CE/Jupiter)
        run: python3 scripts/verify_bundle.py
      - name: Verify exactly one custom dragon, zero IceAndFire gameplay registries or items
        run: python3 scripts/verify_single_dragon.py
      - name: Verify ORIGINAL CE grounded movement logic and restore after flying
        run: python3 scripts/verify_ce_ground_move.py
      - name: Verify owner defense, baby bite and scorched CE terrain
        run: python3 scripts/verify_defend_scorch.py
      - name: Verify CE tactical combat and natural bombing patrol
        run: python3 scripts/verify_marked_assault.py
      - name: Verify smart creature combat without fire or bombing regression
        run: python3 scripts/verify_smart_creature_combat.py
      - name: Verify terrestrial pursuit, compact electric breath and larger heat footprint
        run: python3 scripts/verify_ground_hunt_electric.py
      - name: Verify organic sorties, distributed impact coverage and radius guards
        run: python3 scripts/verify_organic_bombardment.py
      - name: Verify fire immunity, retaliation, lateral burn and cave-mouth focus
        run: python3 scripts/verify_fire_defense_hunt.py
      - name: Audit perception geometry and cave-size clearance regressions
        run: python3 scripts/verify_reliability_review.py
      - name: Verify persistent owner-only dragon item, sprite and head anchor
        run: python3 scripts/verify_head_bond.py
      - name: Verify server-only environment perception and temporary HUD
        run: python3 scripts/verify_world_perception.py
      - name: Verify unified V menu, secure targeting and owner actions
        run: python3 scripts/verify_marked_preview.py
      - name: Verify connected cave corridors and stable native A* route
        run: python3 scripts/verify_cave_pathfinding.py
      - name: Verify cave entrance scouting and stationary aiming regression
        run: python3 scripts/verify_cave_aim_fixes.py
      - name: Verify unreachable prey escalation and safe cave/rock pursuit
        run: python3 scripts/verify_relentless_hunt.py
      - name: Verify flame-first irregular terrain and progressive heat
        run: python3 scripts/verify_irregular_flame_heat.py
      - name: Verify fire ignition without direct wood demolition
        run: python3 scripts/verify_bombardment_direction.py
      - name: Verify blue soul-fire volume and original CE attack-stream poses
        run: python3 scripts/verify_blue_fire_pose.py
      - name: Verify CE lightning and keep fire + ONE Auren
        run: python3 scripts/verify_lightning_breath.py
      - name: Verify Tabula neck pose
        run: python3 scripts/verify_neck_pose.py
      - name: Verify original Tabula animations
        run: python3 scripts/verify_original_animations.py
      - name: Verify day/night routine, weather shelter, passive curiosity and CE rest poses
        run: python3 scripts/verify_daily_routine.py
      - name: Verify natural companion idle and sensible ground-first following
        run: python3 scripts/verify_natural_companion.py
      - name: Verify adult/baby follow behavior
        run: python3 scripts/verify_follow_behavior.py
      - name: Verify mounted dragon control
        run: python3 scripts/verify_riding_behavior.py
      - name: Verify mounted fire-breath baseline
        run: python3 scripts/verify_fire_breath.py
      - name: Audit Tabula pose geometry (read-only)
        run: python3 scripts/audit_tabula_geometry.py --jar build/libs/aurenminecraft-*.jar --out build/reports/pose_audit
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auren-0730-HEAD-BOND-ALPHA
          path: build/libs/*.jar
          if-no-files-found: error
