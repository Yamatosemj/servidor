name: Auren 0.7 — Complete Original CE Engine and Fixed Resources
on:
  push:
    branches:
      - feat/auren-ce-complete-source-v070
      - fix/ce-resource-integrity-v070
      - fix/bundle-jupiter-in-auren-v070
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/native-engine.yml"
      - "scripts/verify_ce_native_*.py"
      - "scripts/repair_ce_resources.py"
      - "src/**"
      - "build.gradle"
  workflow_dispatch:

jobs:
  full-original-ce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify pinned complete CE source revision
        run: python3 scripts/verify_ce_native_source.py
      - name: Build Auren companion mod
        run: gradle build --no-daemon --stacktrace
      - name: Confirm bundled Uranus and Jupiter are native NeoForge mods
        run: python3 scripts/verify_bundle.py
      - name: Build all unmodified IceAndFire CE source
        working-directory: vendor/iceandfire-ce
        run: gradle build --no-daemon --stacktrace
      - name: Verify full original bytecode and fixed-resource distribution
        run: python3 scripts/verify_ce_native_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: auren-v070-ce-resources-fixed
          path: build/ce-native-dist/
          if-no-files-found: error
