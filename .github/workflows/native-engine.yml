name: Auren 0.7 — Complete Original CE Source
on:
  push:
    branches:
      - feat/auren-ce-complete-source-v070
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/native-engine.yml"
      - "scripts/verify_ce_native_*.py"
      - "src/**"
      - "build.gradle"
  workflow_dispatch:

jobs:
  full-original-ce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify original complete CE source and revision
        run: python3 scripts/verify_ce_native_source.py
      - name: Build Auren companion mod
        run: gradle build --no-daemon --stacktrace
      - name: Compile ALL original IceAndFire CE dragon engine and systems
        working-directory: vendor/iceandfire-ce
        run: gradle build --no-daemon --stacktrace
      - name: Verify native CE class set and package both JARs
        run: python3 scripts/verify_ce_native_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: auren-v070-complete-original-ce-test
          path: build/ce-native-dist/
          if-no-files-found: error
