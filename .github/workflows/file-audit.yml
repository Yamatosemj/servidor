name: Auren + IceAndFire — Individual File Audit
on:
  push:
    branches:
      - audit/file-by-file-v070
      - fix/ce-resource-integrity-v070
      - fix/bundle-jupiter-in-auren-v070
  pull_request:
  workflow_dispatch:

jobs:
  audit-every-file:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Audit all ORIGINAL tracked source files without modifying upstream
        run: python3 scripts/audit_each_file.py
      - name: Compile Auren Java
        run: gradle build --no-daemon --stacktrace
      - name: Verify Jupiter and Uranus are nested mods inside Auren
        run: python3 scripts/verify_bundle.py
      - name: Compile full original CE Java
        working-directory: vendor/iceandfire-ce
        run: gradle build --no-daemon --stacktrace
      - name: Repair inherited resource errors in DISTRIBUTED JAR and verify Java bytecode unchanged
        run: python3 scripts/verify_ce_native_binary.py
      - name: Gate every original resource error against its proven runtime fix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/reports/file_audit")
          data = [json.loads(line) for line in (root / "every_file.jsonl").read_text().splitlines()]
          original_errors = {r["path"] for r in data if r["status"] == "ERROR"}
          manifest = json.loads(Path("build/ce-native-dist/ce-resource-patch-manifest.json").read_text())
          corrected = {"vendor/iceandfire-ce/src/main/resources/" + r["original"]
                       for r in manifest["records"]}
          print("Original source defect paths:", len(original_errors))
          print("Runtime corrected paths:", len(corrected))
          print("Unrepaired errors:", sorted(original_errors - corrected))
          print("Unexpected fixes:", sorted(corrected - original_errors))
          assert len(original_errors) == len(corrected) == 37
          assert original_errors == corrected, "Unrepaired errors found"
          assert manifest["counts"] == {"extension": 18, "encoding": 11, "png_crc": 8}
          assert manifest["preserved_classes"] > 100
          print("PASS: 37/37 original CE resource issues corrected in runtime JAR")
          PY
      - name: Upload full source audit and repaired test distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auren-ce-audit-fixed-37-resources
          path: |
            build/reports/file_audit/
            build/ce-native-dist/
          if-no-files-found: error
