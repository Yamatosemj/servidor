import java.security.MessageDigest
import java.nio.charset.StandardCharsets
import java.util.HexFormat

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://cursemaven.com' }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        aurenminecraft { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Exact original CE engine used only for the native parity baseline.
    // Not bundled: install Ice and Fire CE 2.1.4 separately at runtime.
    compileOnly 'curse.maven:iceandfire-ce-1040076:9128508'
    // Embeds the Uranus mod as a nested JAR so users install only Auren Minecraft.
    // Do not shade/merge mod classes: NeoForge Jar-in-Jar reads its original metadata.
    // CurseMaven version 8682870 corresponds to Uranus 3.0-beta.1 on NeoForge 1.21.1.
    // IceAndFire-CE itself is NOT a dependency.
    jarJar(implementation('curse.maven:uranus-1010827:8682870')) {
        version {
            strictly '[8682870]'
            prefer '8682870'
        }
    }
}

